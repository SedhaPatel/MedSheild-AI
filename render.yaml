# Render Blueprint for MedShield: one Docker service serving the API and the React UI.
# Use with New > Blueprint when this repository is connected to your Render account. Without
# repository access, create the service from the public repo URL instead (DEPLOYMENT.md > Render).
#
# Default: the FREE plan (512 MB RAM, 0.1 CPU). It sleeps after 15 idle minutes (~1 min to wake)
# and keeps nothing across restarts, so studies and their keys are lost on every restart/deploy.
#
# Paid alternative with persistent studies (Standard plan, 2 GB RAM, plus disk):
#   1. plan: standard
#   2. delete the "Low-memory mode" variables below (full-resolution images, faster inference)
#   3. add the disk and keystore settings:
#        disk:
#          name: medshield-data
#          mountPath: /app/storage
#          sizeGB: 5
#      and under envVars:
#        - key: MEDSHIELD_KMS_KEYSTORE_PATH
#          value: /app/storage/kms/keystore.json
#      (keys are then stored on the same disk as the encrypted studies: fine for a demo, not a
#      substitute for a real KMS)
services:
  - type: web
    name: medshield
    runtime: docker
    plan: free
    region: singapore
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Required secrets: random values generated by Render when the service is created
      - key: MEDSHIELD_SECRET_PEPPER
        generateValue: true
      - key: MEDSHIELD_JWT_SECRET_KEY
        generateValue: true
      # Sign-in accounts: paste the one-line JSON printed by `python scripts/create_user.py --show`
      - key: MEDSHIELD_USERS_JSON
        sync: false
      # Published demo logins stay off; set "true" only for a throwaway demo (anyone could sign in as admin)
      - key: MEDSHIELD_ENABLE_DEMO_USERS
        value: "false"
      # Low-memory mode for the free plan: uploads shrunk to <= 1024 px, lean allocator (peak ~475 MB)
      - key: MEDSHIELD_MAX_IMAGE_DIM
        value: "1024"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_MMAP_THRESHOLD_
        value: "131072"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
